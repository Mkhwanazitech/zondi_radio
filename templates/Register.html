<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title>
<style>body{background:#0f172a;color:white;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.box{background:#1e293b;padding:25px;border-radius:16px;width:90%;max-width:380px}input{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:white;box-sizing:border-box}button{width:100%;padding:12px;background:#22c55e;color:black;font-weight:bold;border:none;border-radius:8px;margin-top:10px;cursor:pointer}.roles{display:flex;gap:8px}.roles label{flex:1;background:#0f172a;padding:8px;border-radius:8px;text-align:center;font-size:12px;border:1px solid #334155;cursor:pointer}</style>
</head><body>
<div class="box" id="step1">
<h3>Create ZONDI Account</h3>
<input id="username" placeholder="Username min 3">
<input id="cell" placeholder="Cell 082...">
<input id="pw" type="password" placeholder="Password 6+">
<input id="cpw" type="password" placeholder="Confirm">
<div class="roles"><label><input type="radio" name="role" value="client" checked> Client</label><label><input type="radio" name="role" value="patrol"> Patroller</label><label><input type="radio" name="role" value="dev"> Dev</label></div>
<button onclick="doReg()">Create Account + Send OTP</button><p id="msg" style="color:#f87171;font-size:13px"></p>
</div>
<div class="box" id="step2" style="display:none"><h3>Enter OTP</h3><p>Check Render Logs for OTP</p><p>Cell: <b id="cellShow"></b></p><input id="otp" placeholder="6-digit OTP"><button onclick="doVerify()">Verify</button><p id="msg2" style="color:#f87171"></p></div>
<script>
let currentCell='';
async function doReg(){const u=document.getElementById('username').value.trim();const c=document.getElementById('cell').value.trim();const pw=document.getElementById('pw').value;const cpw=document.getElementById('cpw').value;const role=document.querySelector('input[name=role]:checked').value;if(!u||!c||!pw){document.getElementById('msg').innerText='Fill all';return}const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,cell:c,role,password:pw,confirm_password:cpw})});const j=await r.json();if(!j.ok){document.getElementById('msg').innerText=j.error;return}currentCell=j.cell;document.getElementById('cellShow').innerText=currentCell+' OTP:'+j.dev_otp;document.getElementById('step1').style.display='none';document.getElementById('step2').style.display='block';alert('OTP:'+j.dev_otp)}
async function doVerify(){const otp=document.getElementById('otp').value.trim();const r=await fetch('/api/verify-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cell:currentCell,otp})});const j=await r.json();if(j.ok){alert('Verified! Login');location.href='/login';}else document.getElementById('msg2').innerText=j.error}
</script></body></html>
