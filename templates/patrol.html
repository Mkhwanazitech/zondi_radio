<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif;background:#fdf6f1}.leaflet-container{border-radius:20px}</style>
</head>
<body class="min-h-screen flex justify-center p-4 pb-24 bg-[#fdf6f1]">
<div class="bg-white w-full max-w-[420px] rounded-[32px] p-6 shadow-[0_20px_60px_rgba(0,0,0,0.08)] mt-4 h-fit">

<!-- SAME HEADER AS LOGIN YOU LOVE -->
<div class="flex justify-center mb-4">
<div class="w-16 h-16 bg-[#ff6b2b] rounded-[18px] flex items-center justify-center text-white text-2xl font-bold">Z</div>
</div>
<h1 class="text-center text-[28px] font-bold text-[#1a1d2d]">Welcome Home</h1>
<p class="text-center text-gray-400 text-[13px]">ZONDI Patrol - Ga-Rankuwa Safe</p>
<div class="flex justify-center gap-2 mt-3">
<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold">● On Duty</span>
<span class="bg-[#fff5eb] text-[#ff6b2b] px-3 py-1 rounded-full text-xs font-bold" id="statusText">GPS Off</span>
</div>

<!-- MAP - INSIDE SAME CARD STYLE -->
<div class="mt-6 bg-[#f9f7f5] rounded-[20px] p-2">
<div id="map" style="height:280px"></div>
</div>

<div class="grid grid-cols-2 gap-3 mt-3">
<button onclick="goOnDuty()" class="bg-[#ff6b2b] text-white p-4 rounded-2xl font-bold text-sm">✅ On Duty</button>
<button onclick="panic()" class="bg-[#1a1d2d] text-white p-4 rounded-2xl font-bold text-sm">🚨 Panic</button>
</div>

<!-- JOBS - SAME SOFT INPUT STYLE AS LOGIN -->
<div class="mt-6">
<p class="font-bold text-sm mb-2">Incoming Jobs</p>
<div id="jobList" class="space-y-2">
<div class="bg-[#f9f7f5] p-4 rounded-2xl flex justify-between items-center">
<div><p class="font-bold text-sm">Intrusion Alert</p><p class="text-xs text-gray-400">0.3km • Thabo</p></div>
<button class="bg-[#ff6b2b] text-white px-4 py-2 rounded-full text-xs font-bold">Accept</button>
</div>
<div class="bg-[#e8f0fe] p-4 rounded-2xl flex justify-between items-center">
<div><p class="font-bold text-sm">Medical Assist</p><p class="text-xs text-gray-400">1.2km • HQ</p></div>
<button class="bg-[#1a1d2d] text-white px-4 py-2 rounded-full text-xs font-bold">Accept</button>
</div>
</div>
</div>

<!-- CHAT - SAME STYLE -->
<div class="mt-6">
<p class="font-bold text-sm mb-2">Patrol Chat</p>
<div id="chatBox" class="bg-[#f9f7f5] rounded-2xl p-3 h-[120px] overflow-y-auto text-sm">
<p class="bg-white p-2 rounded-xl w-fit mb-1"><b>HQ:</b> Status? 👀</p>
</div>
<div class="flex gap-2 mt-2">
<input id="chatInput" placeholder="Type..." class="flex-1 p-3 rounded-2xl bg-[#f9f7f5] outline-none text-sm">
<button onclick="sendChat()" class="bg-[#ff6b2b] text-white px-5 rounded-2xl font-bold text-sm">Send</button>
</div>
</div>

<a href="/logout" class="block text-center text-gray-400 text-xs mt-6">Logout</a>
</div>

<script>
const socket=io();
let map=L.map('map').setView([-25.604,28.001],14);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let me=L.marker([-25.604,28.001]).addTo(map);
function goOnDuty(){
 document.getElementById('statusText').innerText='🟢 Live GPS';
 document.getElementById('statusText').className='bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold';
 if(navigator.geolocation){
  navigator.geolocation.watchPosition(p=>{
   me.setLatLng([p.coords.latitude,p.coords.longitude]);
   map.setView([p.coords.latitude,p.coords.longitude],15);
   socket.emit('patrol_location',{lat:p.coords.latitude,lng:p.coords.longitude});
  });
 }
}
function panic(){socket.emit('panic',{msg:'Backup!'});alert('Backup sent!');}
function sendChat(){
 let m=document.getElementById('chatInput').value; if(!m) return;
 document.getElementById('chatBox').innerHTML+=`<div class="bg-[#ff6b2b] text-white p-2 rounded-xl w-fit ml-auto mb-1">${m}</div>`;
 socket.emit('patrol_chat',{msg:m}); document.getElementById('chatInput').value='';
}
</script>
</body>
</html>
