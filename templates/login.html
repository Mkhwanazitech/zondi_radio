<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login - ZONDI V7</title>
<style>body{background:#0f172a;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#1e293b;padding:25px;border-radius:14px;width:95%;max-width:380px}input{width:100%;padding:12px;margin:7px 0;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#fff;box-sizing:border-box}button{width:100%;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;margin-top:10px;cursor:pointer}.err{background:#7f1d1d;padding:10px;border-radius:8px;margin-bottom:10px}.ok{background:#14532d;padding:10px;border-radius:8px}</style>
</head><body><div class="card">
<h2 style="text-align:center">🔓 ZONDI V7 Login</h2>
<div id="msg"></div>
<form id="loginForm">
<input name="login" placeholder="Username OR Cell 082..." required>
<input type="password" name="password" placeholder="Password" required>
<button type="submit">Login</button>
</form>
<p style="text-align:center;font-size:14px;margin-top:15px"><a href="/register" style="color:#22c55e">Create Account</a> | <a href="#" onclick="forgot()" style="color:#94a3b8">Forgot Password?</a> | <a href="/dev" style="color:#f59e0b">Dev</a></p>
</div>
<script>
document.getElementById('loginForm').onsubmit=async(e=>{
 e.preventDefault();
 const fd=new FormData(e.target); const obj=Object.fromEntries(fd);
 const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
 const d=await r.json();
 if(!d.ok){ document.getElementById('msg').innerHTML=`<div class=err>${d.error}</div>`; return; }
 location.href='/dashboard';
};
async function forgot(){
 const login=prompt('Enter username or cell:'); if(!login) return;
 const r=await fetch('/api/forgot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login})});
 const d=await r.json(); if(!d.ok){ alert(d.error); return; }
 const otp=prompt(`DEV OTP is ${d.dev_otp} - Enter OTP:`); if(!otp) return;
 const np=prompt('New password:'); const cp=prompt('Confirm password:');
 const r2=await fetch('/api/verify-reset',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cell:d.cell,otp,new_password:np,confirm_password:cp})});
 const d2=await r2.json(); alert(d2.ok?'Reset OK - Login now':d2.error);
}
</script></body></html>
