<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Outfit',sans-serif}</style></head>
<body class="bg-[#fdf8f3] min-h-screen flex items-center justify-center p-4">
<div class="w-full max-w-md bg-white rounded-[32px] shadow-[0_20px_60px_rgba(0,0,0,0.08)] p-8">
<div class="text-center mb-8"><div class="w-16 h-16 bg-[#ff6b2b] rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold">Z</div>
<h1 class="text-3xl font-bold mt-4 text-[#1a1d2d]">Welcome Home</h1><p class="text-gray-500 mt-1">ZONDI Patrol - Ga-Rankuwa Safe</p></div>
<input id="username" placeholder="Username" class="w-full p-4 rounded-xl bg-gray-50 mb-3 outline-none">
<input id="phone" placeholder="Phone" class="w-full p-4 rounded-xl bg-gray-50 mb-3 outline-none">
<input id="password" type="password" placeholder="Password" class="w-full p-4 rounded-xl bg-gray-50 mb-3 outline-none">
<select id="role" class="w-full p-4 rounded-xl bg-gray-50 mb-4"><option value="client">I need protection (Client)</option><option value="patroller">I am Patroller</option><option value="dev">Developer</option></select>
<div class="flex gap-2 mb-4"><input id="otp" placeholder="OTP" class="flex-1 p-4 rounded-xl bg-orange-50 outline-none"><button onclick="sendOtp()" class="bg-[#1a1d2d] text-white px-6 rounded-xl font-semibold">Get OTP</button></div>
<button onclick="doRegister()" class="w-full bg-[#ff6b2b] text-white p-4 rounded-xl font-bold text-lg">Create Account & Enter</button>
<p class="text-center mt-6 text-gray-400 text-sm">Already have account? <span onclick="doLogin()" class="text-[#ff6b2b] font-bold cursor-pointer">Login</span></p>
<p id="otpShow" class="text-center mt-3 text-xs text-gray-400"></p>
</div>
<script>
async function sendOtp(){ let r=await fetch('/api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})}); let d=await r.json(); document.getElementById('otpShow').innerText='Mock OTP: '+d.mock_otp; }
async function doRegister(){ let body={username:username.value,password:password.value,phone:phone.value,role:role.value,otp:otp.value}; let r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); let d=await r.json(); if(d.ok) location.href=d.redirect; else alert(d.error); }
async function doLogin(){ let body={username:username.value,password:password.value}; let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); let d=await r.json(); if(d.ok) location.href=d.redirect; else alert(d.msg); }
</script></body></html>
