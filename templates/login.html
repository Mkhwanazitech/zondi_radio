<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZONDI - Login</title>
<style>
body{background:#000;color:gold;font-family:Arial;padding:20px}
.box{max-width:400px;margin:50px auto;border:2px solid gold;padding:20px;border-radius:10px}
input,select{width:100%;padding:12px;margin:8px 0;background:#111;color:gold;border:1px solid gold;border-radius:5px;box-sizing:border-box}
button{width:100%;padding:12px;background:gold;color:#000;font-weight:bold;border:none;border-radius:5px;cursor:pointer;margin-top:10px}
h2{text-align:center}
.small{font-size:12px;color:#888;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="box">
<h2>ZONDI SECURITY</h2>
<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">
<input id="phone" placeholder="Phone e.g 0821234567">
<select id="role">
<option value="client">Client</option>
<option value="patroller">Patroller</option>
<option value="dev">Dev</option>
</select>
<input id="otp" placeholder="Enter OTP">
<button onclick="sendOtp()">Send OTP</button>
<button onclick="register()">Register</button>
<hr style="border-color:gold;margin:15px 0">
<button onclick="login()" style="background:#fff">Login</button>
<p id="msg" class="small"></p>
<p class="small">Created by mkhwanazitech.com</p>
</div>
<script>
async function sendOtp(){
 const r = await fetch('/api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value, phone:document.getElementById('phone').value})});
 const d = await r.json();
 if(d.ok){document.getElementById('msg').innerText='MOCK OTP: '+d.mock_otp+' - copy it to OTP field'; document.getElementById('otp').value=d.mock_otp;} else {document.getElementById('msg').innerText=d.error}
}
async function register(){
 const body={username:document.getElementById('username').value,password:document.getElementById('password').value,phone:document.getElementById('phone').value,role:document.getElementById('role').value,otp:document.getElementById('otp').value};
 const r = await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d = await r.json();
 if(d.ok) window.location=d.redirect; else document.getElementById('msg').innerText=d.error||d.msg;
}
async function login(){
 const body={username:document.getElementById('username').value,password:document.getElementById('password').value};
 const r = await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
 const d = await r.json();
 if(d.ok) window.location=d.redirect; else document.getElementById('msg').innerText=d.msg;
}
</script>
</body>
</html><div id="otpBox">
<input id="otp" placeholder="Enter OTP">
<p id="mockOtp"></p>
</div>

<button id="mainBtn" onclick="handle()">Send OTP</button>
<p id="msg"></p>
<div class="footer">Created by mkhwanazitech.com</div>
</div>

<script>
let mode='register';
function setMode(m){
 mode=m;
 document.getElementById('tLogin').className=m=='login'?'tab active':'tab';
 document.getElementById('tReg').className=m=='register'?'tab active':'tab';
 document.getElementById('regFields').style.display=m=='register'?'block':'none';
 document.getElementById('otpBox').style.display='none';
 document.getElementById('mainBtn').innerText=m=='register'?'Send OTP':'Login';
 document.getElementById('msg').innerText='';
}
setMode('register');

async function handle(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('password').value.trim();
 let ph=document.getElementById('phone').value.trim();
 let r=document.getElementById('role').value;
 let o=document.getElementById('otp').value.trim();
 let msgEl=document.getElementById('msg');

 if(mode=='register' && document.getElementById('otpBox').style.display=='none'){
   if(!u||!p||!ph){ msgEl.innerText='Fill all fields'; return; }
   msgEl.innerText='Sending OTP...';
   let res=await fetch('/api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,phone:ph,role:r})});
   let d=await res.json();
   if(d.ok){ 
     document.getElementById('otpBox').style.display='block'; 
     document.getElementById('mockOtp').innerText='MOCK OTP (testing): '+d.mock_otp; 
     document.getElementById('mainBtn').innerText='Verify & Register'; 
     msgEl.innerText='OTP sent! Check below';
   } else msgEl.innerText=d.error||d.msg;
 } else if(mode=='register'){
   let res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,phone:ph,role:r,otp:o})});
   let d=await res.json(); 
   if(d.ok) location=d.redirect; else msgEl.innerText=d.error||d.msg;
 } else {
   // login
   if(!u||!p){ msgEl.innerText='Enter username & password'; return; }
   let res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
   let d=await res.json(); 
   if(d.ok) location=d.redirect; else msgEl.innerText=d.error||d.msg;
 }
}
</script>
</body>
</html>
