
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZONDI PATROL SERVICE</title>
<style>
body{background:#000;color:#D4AF37;font-family:sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}
.card{background:#111;border:1px solid #D4AF37;border-radius:16px;padding:25px;width:90%;max-width:380px;box-shadow:0 0 20px rgba(212,175,55,0.3)}
h1{text-align:center;color:gold;letter-spacing:2px;line-height:1.2}
input,select{width:100%;padding:12px;margin:8px 0;background:#000;border:1px solid gold;color:gold;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:gold;color:black;font-weight:bold;border:none;border-radius:8px;margin-top:10px;cursor:pointer;font-size:16px}
.tabs{display:flex;gap:10px;margin-bottom:15px}
.tab{flex:1;text-align:center;padding:8px;border:1px solid gold;cursor:pointer;border-radius:8px}
.active{background:gold;color:black}
.footer{text-align:center;margin-top:20px;font-size:12px;opacity:0.7;color:gold}
#otpBox{display:none}
#msg{color:#ff4444;text-align:center;font-size:13px}
#mockOtp{color:white;background:#222;padding:8px;border-radius:5px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>ZONDI<br>PATROL SERVICE</h1>
<p style="text-align:center;font-size:13px">Welcome, secure your community</p>

<div class="tabs"><div id="tLogin" class="tab active" onclick="setMode('login')">Login</div><div id="tReg" class="tab" onclick="setMode('register')">Register</div></div>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Create / Enter Password">

<div id="regFields">
<input id="phone" placeholder="Cell number e.g 0712345678">
<select id="role"><option value="client">Client Portal</option><option value="patroller">Patroller Portal</option><option value="dev">Dev Portal</option></select>
</div>

<div id="otpBox">
<input id="otp" placeholder="Enter OTP">
<p id="mockOtp"></p>
</div>

<button id="mainBtn" onclick="handle()">Send OTP</button>
<p id="msg"></p>
<div class="footer">Created by mkhwanazitech.com</div>
</div>

<script>
let mode='register';
function setMode(m){
 mode=m;
 document.getElementById('tLogin').className=m=='login'?'tab active':'tab';
 document.getElementById('tReg').className=m=='register'?'tab active':'tab';
 document.getElementById('regFields').style.display=m=='register'?'block':'none';
 document.getElementById('otpBox').style.display='none';
 document.getElementById('mainBtn').innerText=m=='register'?'Send OTP':'Login';
 document.getElementById('msg').innerText='';
}
setMode('register');

async function handle(){
 let u=document.getElementById('username').value.trim();
 let p=document.getElementById('password').value.trim();
 let ph=document.getElementById('phone').value.trim();
 let r=document.getElementById('role').value;
 let o=document.getElementById('otp').value.trim();
 let msgEl=document.getElementById('msg');

 if(mode=='register' && document.getElementById('otpBox').style.display=='none'){
   if(!u||!p||!ph){ msgEl.innerText='Fill all fields'; return; }
   msgEl.innerText='Sending OTP...';
   let res=await fetch('/api/send-otp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,phone:ph,role:r})});
   let d=await res.json();
   if(d.ok){ 
     document.getElementById('otpBox').style.display='block'; 
     document.getElementById('mockOtp').innerText='MOCK OTP (testing): '+d.mock_otp; 
     document.getElementById('mainBtn').innerText='Verify & Register'; 
     msgEl.innerText='OTP sent! Check below';
   } else msgEl.innerText=d.error||d.msg;
 } else if(mode=='register'){
   let res=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p,phone:ph,role:r,otp:o})});
   let d=await res.json(); 
   if(d.ok) location=d.redirect; else msgEl.innerText=d.error||d.msg;
 } else {
   // login
   if(!u||!p){ msgEl.innerText='Enter username & password'; return; }
   let res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
   let d=await res.json(); 
   if(d.ok) location=d.redirect; else msgEl.innerText=d.error||d.msg;
 }
}
</script>
</body>
</html>
